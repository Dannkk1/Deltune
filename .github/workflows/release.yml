name: Build installable package
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build and test dependencies
        run: pacman -Syu --noconfirm --needed git python pyside6 python-dbus-next python-evdev libratbag desktop-file-utils
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash -c 'source packaging/arch/PKGBUILD; if [[ "$REF_TYPE" == tag ]]; then [[ "$REF_NAME" == "v$pkgver" ]] || { echo "Tag must match PKGBUILD pkgver: v$pkgver"; exit 1; }; fi'
      - name: Test app and launcher
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          bash -n packaging/arch/build.sh packaging/arch/PKGBUILD
          sh -n packaging/arch/g502x-control
          desktop-file-validate packaging/arch/g502x-control.desktop
      - name: Build as unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash packaging/arch/build.sh --nodeps --noconfirm
      - name: Verify and install built package
        run: |
          pacman -Qip dist/*.pkg.tar.zst
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test -x /usr/bin/g502x-control
          test -f /usr/share/g502x-control/backend.py
          desktop-file-validate /usr/share/applications/g502x-control.desktop
          pacman -Qk g502x-control
      - uses: actions/upload-artifact@v4
        with:
          name: g502x-control-arch
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: g502x-control-arch
          path: dist
      - name: Attach installer to preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "G502 X Control $RELEASE_TAG" --notes "Preview release. Download the .pkg.tar.zst installer for CachyOS/Arch. Hardware validation remains pending. See README for installation and compatibility."
          fi
          gh release upload "$RELEASE_TAG" dist/*.pkg.tar.zst dist/SHA256SUMS --clobber
